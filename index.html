<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<meta name="description" content="EaglercraftX 1.8 Offline" />
<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.8, 1.8.8" />

<link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">

<title>Classroom</title>

<meta property="og:locale" content="en-US" />
<meta property="og:type" content="website" />
<meta property="og:title" content="EaglercraftX 1.8" />
<meta property="og:description" content="Play minecraft 1.8 in your browser" />

<script type="text/javascript" src="ModAPI.js"></script>
<script type="text/javascript" src="ModLoader.js"></script>
<script type="text/javascript" src="ModGUI.js"></script>
<script type="text/javascript" src="classes.js"></script>
<script type="text/javascript">
"use strict";
window.addEventListener("load", () => {
	if(document.location.href.startsWith("file:")) {
		alert("Por favor abre esta pagina mediante HTTP (servidor web o GitHub Pages), no directamente desde el archivo.");
	}else {
		const relayId = Math.floor(Math.random() * 3);
		window.eaglercraftXOpts = {
			demoMode: false,
			container: "game_frame",
			assetsURI: "assets.epk",
			localesURI: "lang/",
			worldsDB: "worlds",
			logInvalidCerts: true,
			relays: [
				{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId === 0 },
				{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId === 1 },
				{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId === 2 }
			],
			checkRelaysForUpdates: true
		};

		// %%%%%%%%% mods %%%%%%%%%%%%

		// Primera visita: instala los mods de ejemplo incluidos.
		// Se pueden agregar/quitar desde el boton "Mods" dentro del juego.
		try {
			if(localStorage.getItem("ml::Mods") === null) {
				localStorage.setItem("ml::Mods", JSON.stringify([
					"mods/fps.js",
					"mods/bienvenida.js"
				]));
			}
		}catch(ex) {
			console.error("No se pudo inicializar la lista de mods:", ex);
		}

		// %%%%%%%%%%%%%%%%%%%%%%%%%%%

		var q = window.location.search;
		if(typeof q === "string" && q.startsWith("?")) {
			q = new URLSearchParams(q);
			var s = q.get("server");
			if(s) window.eaglercraftXOpts.joinServer = s;
		}

		main();
	}
});
</script>
</head>
<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:black;">
	<h1 style="color:#cccccc;font-family:sans-serif;font-weight:normal;">Cargando...</h1>
</div>
</body>
</html>
