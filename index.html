<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:#0a0e14;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<meta name="description" content="JEFFCRAFT 1.8" />
<meta name="keywords" content="jeffcraft, 1.8, 1.8.8, mods, navegador" />

<link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">

<title>Classroom</title>

<meta property="og:locale" content="en-US" />
<meta property="og:type" content="website" />
<meta property="og:title" content="JEFFCRAFT 1.8" />
<meta property="og:description" content="JEFFCRAFT: juega, construye y moddea en tu navegador" />

<script type="text/javascript" src="ModAPI.js?v=jeff3"></script>
<script type="text/javascript" src="ModLoader.js?v=jeff3"></script>
<script type="text/javascript" src="ModGUI.js?v=jeff3"></script>
<script type="text/javascript" src="modpack.js?v=jeff3"></script>
<script type="text/javascript" src="classes.js?v=jeff3"></script>
<script type="text/javascript">
"use strict";

// Oculta la pantalla de carga cuando el juego monta su canvas.
function ocultarCargando() {
        var ov = document.getElementById("carga");
        if(ov) {
                ov.style.transition = "opacity 0.5s ease";
                ov.style.opacity = "0";
                setTimeout(function() { if(ov && ov.parentNode) ov.parentNode.removeChild(ov); }, 550);
        }
}

// Mensajes de la barra de estado de JEFFCRAFT mientras carga.
(function() {
        var mensajes = [
                "Cargando JEFFCRAFT...",
                "Descargando mods de Java...",
                "Desempacando recursos...",
                "Preparando el mundo...",
                "Casi listo..."
        ];
        var i = 0;
        window.addEventListener("load", function() {
                var el = document.getElementById("carga_msg");
                if(!el) return;
                setInterval(function() {
                        if(!document.getElementById("carga")) return;
                        i = (i + 1) % mensajes.length;
                        el.textContent = mensajes[i];
                }, 2600);
        });
})();

// Muestra un error en lugar del estado si algo falla.
function mostrarError(msg) {
        var el = document.getElementById("carga_msg");
        if(el) {
                el.textContent = msg;
                el.style.color = "#ff6a6a";
                el.style.fontSize = "15px";
        }
        var bar = document.getElementById("carga_barra");
        if(bar) bar.style.background = "#7a2f2f";
}

// Si algun archivo (classes.js, ModAPI.js, ...) no se puede descargar, avisar.
window.addEventListener("error", function(evt) {
        var t = evt.target;
        if(t && t.tagName === "SCRIPT" && t.src) {
                mostrarError("Error: no se pudo descargar " + t.src.split("/").pop() + ". Revisa tu conexion e intenta de nuevo (F5).");
        }
}, true);

window.addEventListener("load", () => {
        if(document.location.href.startsWith("file:")) {
                alert("Por favor abre esta pagina mediante HTTP (servidor web o GitHub Pages), no directamente desde el archivo.");
        }else {
                // Ocultar la pantalla de carga en cuanto el juego cree su canvas
                try {
                        var obs = new MutationObserver(function(muts) {
                                for(var i = 0; i < muts.length; i++) {
                                        var nodos = muts[i].addedNodes;
                                        for(var j = 0; j < nodos.length; j++) {
                                                if(nodos[j].tagName === "CANVAS") {
                                                        obs.disconnect();
                                                        ocultarCargando();
                                                        return;
                                                }
                                        }
                                }
                        });
                        obs.observe(document.body, { childList: true });
                }catch(ex) {
                        console.warn("MutationObserver no disponible:", ex);
                }

                const relayId = Math.floor(Math.random() * 3);
                window.eaglercraftXOpts = {
                        demoMode: false,
                        container: "game_frame",
                        assetsURI: "assets.epk?v=jeff3",
                        localesURI: "lang/",
                        worldsDB: "worlds",
                        logInvalidCerts: true,
                        relays: [
                                { addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId === 0 },
                                { addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId === 1 },
                                { addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId === 2 }
                        ],
                        checkRelaysForUpdates: true
                };

                var q = window.location.search;
                if(typeof q === "string" && q.startsWith("?")) {
                        q = new URLSearchParams(q);
                        var s = q.get("server");
                        if(s) window.eaglercraftXOpts.joinServer = s;
                }

                // %%%%%%%%% mods %%%%%%%%%%%%

                // %%%%% rediseno visual JEFFCRAFT v3 %%%%%
                // Borra el progreso guardado (mundos, ajustes, paquetes de
                // recursos) UNA sola vez para que todos los jugadores vean los
                // cambios de diseno. Los mods instalados NO se tocan.
                var VERSION_DISENO = "3";
                async function aplicarRediseno() {
                        try {
                                if (localStorage.getItem("jc::diseno") === VERSION_DISENO) return;
                        } catch (e) { return; }
                        console.log("JEFFCRAFT: aplicando rediseno v" + VERSION_DISENO + " (se borra el progreso guardado)");
                        // 1) IndexedDB: sistema de archivos del juego
                        try {
                                var nombres = [];
                                if (indexedDB.databases) {
                                        var dbs = await indexedDB.databases();
                                        nombres = dbs.map(function (d) { return d.name; }).filter(Boolean);
                                }
                                if (!nombres.length) {
                                        nombres = ["_net_lax1dude_eaglercraft_v1_8_internal_PlatformFilesystem_1_8_8_"];
                                }
                                var objetivo = nombres.filter(function (n) { return String(n).indexOf("eaglercraft") !== -1; });
                                await Promise.all(objetivo.map(function (n) {
                                        return new Promise(function (res) {
                                                try {
                                                        var req = indexedDB.deleteDatabase(n);
                                                        req.onsuccess = req.onerror = req.onblocked = function () { res(); };
                                                } catch (e) { res(); }
                                        });
                                }));
                        } catch (e) { console.warn("JEFFCRAFT: no se pudo limpiar IndexedDB:", e); }
                        // 2) ajustes y perfil guardados en localStorage
                        try {
                                var borrar = [];
                                for (var bi = 0; bi < localStorage.length; bi++) {
                                        var bk = localStorage.key(bi);
                                        if (bk && (bk.indexOf("_eaglercraftX") === 0 || (bk.indexOf("eaglercraft") !== -1 && bk.indexOf("ml::") !== 0))) borrar.push(bk);
                                }
                                borrar.forEach(function (k) { localStorage.removeItem(k); });
                        } catch (e) {}
                        try { localStorage.setItem("jc::diseno", VERSION_DISENO); } catch (e) {}
                }

                // Paquete de mods OBLIGATORIO: todo jugador nuevo debe
                // descargar los mods del sitio (mods/mods.json) antes de jugar.
                // Se guardan en localStorage, asi solo se descargan una vez.
                async function arrancarConMods() {
                        try {
                                await aplicarRediseno();
                        } catch (e) {
                                console.warn("Error al aplicar el rediseno:", e);
                        }

                        try {
                                if(window.ModPackGate) {
                                        var listo = await window.ModPackGate.ensure();
                                        if(!listo) {
                                                mostrarError("Error: no se pudieron instalar los mods del sitio.");
                                                return;
                                        }
                                }else{
                                        // Respaldo por si modpack.js no se cargo
                                        if(localStorage.getItem("ml::Mods") === null) {
                                                localStorage.setItem("ml::Mods", JSON.stringify([
                                                        "mods/fps.js",
                                                        "mods/bienvenida.js"
                                                ]));
                                        }
                                }
                        }catch(ex) {
                                console.error("Error al instalar el paquete de mods:", ex);
                        }

                        try {
                                if(typeof main !== "function") {
                                        mostrarError("Error: classes.js no se cargo correctamente. Recarga la pagina (F5).");
                                        return;
                                }
                                main();
                        }catch(ex) {
                                mostrarError("Error al iniciar el juego: " + (ex && ex.message ? ex.message : ex));
                                console.error(ex);
                        }
                }
                arrancarConMods();

                // %%%%%%%%%%%%%%%%%%%%%%%%%%%
        }
});
</script>
</head>
<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:#0a0e14;" id="game_frame">
<div id="carga" style="position:fixed;top:0px;left:0px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background-color:#0a0e14;z-index:999;pointer-events:none;overflow:hidden;">

        <!-- patron de bloques de fondo -->
        <div style="position:absolute;top:0px;left:0px;width:100%;height:100%;opacity:0.16;
                background-image:
                        linear-gradient(45deg, #1b2b3a 25%, transparent 25%, transparent 75%, #1b2b3a 75%),
                        linear-gradient(45deg, #1b2b3a 25%, transparent 25%, transparent 75%, #1b2b3a 75%);
                background-size:48px 48px;
                background-position:0 0,24px 24px;
                animation:jcBlocks 14s linear infinite;
                -webkit-animation:jcBlocks 14s linear infinite;"></div>
        <style>
                @keyframes jcBlocks { from { background-position:0 0,24px 24px; } to { background-position:96px 96px,120px 120px; } }
                @-webkit-keyframes jcBlocks { from { background-position:0 0,24px 24px; } to { background-position:96px 96px,120px 120px; } }
                @keyframes jcPulso { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
                @-webkit-keyframes jcPulso { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
                @keyframes jcShimmer { from { transform:translateX(-160px); } to { transform:translateX(320px); } }
                @-webkit-keyframes jcShimmer { from { transform:translateX(-160px); } to { transform:translateX(320px); } }
        </style>

        <!-- marca JEFFCRAFT -->
        <div style="position:relative;text-align:center;font-family:'Courier New',monospace;font-weight:bold;user-select:none;-webkit-user-select:none;">
                <div style="font-size:54px;letter-spacing:4px;line-height:1;margin-bottom:6px;text-shadow:3px 3px 0 #06110a,6px 6px 0 rgba(0,0,0,0.45);">
                        <span style="color:#4fc058;">JEFF</span><span style="color:#eeb13e;">CRAFT</span>
                </div>
                <div style="font-size:13px;color:#7d8fa3;letter-spacing:6px;margin-bottom:34px;">1.8&nbsp;&middot;&nbsp;EDICION&nbsp;MODS</div>

                <!-- barra de progreso animada -->
                <div style="position:relative;width:280px;height:14px;margin:0 auto;background:#141c26;border:2px solid #2a3a4d;box-shadow:0 0 0 2px #060a0e, inset 0 0 6px rgba(0,0,0,0.6);overflow:hidden;">
                        <div id="carga_barra" style="position:absolute;top:0px;left:0px;width:100%;height:100%;background:linear-gradient(90deg,#2d7a38 0%,#4fc058 55%,#eeb13e 100%);opacity:0.9;"></div>
                        <div style="position:absolute;top:0px;left:0px;width:70px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);animation:jcShimmer 1.6s ease-in-out infinite;-webkit-animation:jcShimmer 1.6s ease-in-out infinite;"></div>
                        <!-- marcas de bloque -->
                        <div style="position:absolute;top:0px;left:0px;width:100%;height:100%;background-image:linear-gradient(90deg, rgba(0,0,0,0.35) 1px, transparent 1px);background-size:14px 100%;"></div>
                </div>

                <div id="carga_msg" style="margin-top:22px;color:#b7c5d4;font-family:sans-serif;font-weight:normal;font-size:15px;letter-spacing:1px;animation:jcPulso 2.2s ease-in-out infinite;-webkit-animation:jcPulso 2.2s ease-in-out infinite;">Cargando JEFFCRAFT...</div>
        </div>
</div>
</body>
</html>
